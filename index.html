<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Vini Manga &amp; João — Code Adventure</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <div id="screen">
        <canvas id="c" width="640" height="584" tabindex="0"></canvas>
        <div id="pad">
          <div id="stick" data-ui="stick">
            <div id="stick-knob"></div>
          </div>
          <button type="button" id="btn-swap" class="mini" data-key="tab" data-ui="swap" aria-label="Trocar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h11l-3.2-3.2"/><path d="M17 16H6l3.2 3.2"/></svg>
          </button>
          <button type="button" id="btn-hand" class="orb" data-key="e" data-ui="e" aria-label="Falar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V6.2a1.8 1.8 0 0 1 3.6 0V11"/><path d="M11.6 10.2V5a1.8 1.8 0 0 1 3.6 0V12"/><path d="M15.2 11.2V7.2a1.8 1.8 0 0 1 3.6 0v7.2c0 3.4-2.4 6.2-6.4 6.2h-1.1C8 20.6 5.2 17.8 4.5 14.6L3.2 11.4a1.7 1.7 0 0 1 3.1-1.4L8 12.4"/></svg>
          </button>
          <button type="button" id="btn-run" class="orb" data-key="r" data-ui="r" aria-label="Especial">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="15.2" cy="4.6" r="1.7" fill="#fff" stroke="none"/><path d="M9.2 20.5l2.4-4.4 2 .7 1.3-3.6-2.6-1.5 2.8-3.6 3.2 1.3.9 2.4"/><path d="M3.2 8.4h3.6M2.4 11.6h4.4M3.4 14.8h3.4"/></svg>
          </button>
          <button type="button" id="btn-act" class="orb" data-key="space" data-ui="act" aria-label="Ação">
            <svg class="ico-vini" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 17.5h9.2a3.4 3.4 0 0 0 .3-6.8 4.4 4.4 0 0 0-8.4-1.1A3.1 3.1 0 0 0 8 17.5z" fill="#fff" stroke="none"/></svg>
            <svg class="ico-joao" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.5c.4 2.2-.2 4.2-1.6 5.6L6.2 16.8c-.8.8-.8 2 0 2.8.8.8 2 .8 2.8 0l7.7-7.7c1.4-1.4 3.4-2 5.6-1.6-.6 2.2-1.6 4-3.2 5.2L10.6 24" fill="none"/><path d="M8.2 15.2l2.2 2.2" /></svg>
          </button>
          <button type="button" id="btn-pause" class="mini ghost" data-key="escape" data-ui="pause" aria-label="Pausa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5h2.4v13H8zM13.6 5.5H16v13h-2.4z" fill="#fff" stroke="none"/></svg>
          </button>
          <div id="pad-menu">
            <button type="button" data-key="enter" data-ui="go">JOGAR</button>
            <button type="button" data-key="c" data-ui="cont">CONTINUAR</button>
            <button type="button" data-key="k" data-ui="help">CONTROLES</button>
            <button type="button" data-key="m" data-ui="m">MÚSICA</button>
            <button type="button" data-key="h" data-ui="h">DICA</button>
            <button type="button" data-key="enter" data-ui="ok">CONTINUAR</button>
            <button type="button" data-key="escape" data-ui="back">VOLTAR</button>
          </div>
        </div>
      </div>
      <p id="hint"><b>1</b> Vini &nbsp; <b>2</b> João &nbsp; <b>TAB</b> troca &nbsp; <b>ESPAÇO</b> peido ou taco &nbsp; <b>R</b> arroto / moto &nbsp; <b>E</b> falar / SQL / console &nbsp; <b>Q</b> objetivos &nbsp; <b>H</b> dica &nbsp; <b>M</b> música &nbsp; <b>ESC</b> pausa</p>
    </div>
  </div>
  <script src="js/audio.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
